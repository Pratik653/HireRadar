# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hireradar-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*" --timeout-keep-alive 5
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ALLOWED_ORIGINS
        value: https://pratik653.github.io
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: LOG_LEVEL
        value: INFO
